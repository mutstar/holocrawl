<!doctype html><html lang="ko"><meta charset="utf-8"><title>계단 비교</title><style>body{background:#171a1c;color:#e9e8df;font:16px 'Malgun Gothic',sans-serif;margin:24px}h1{font-size:22px}main{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:700px}article{padding:18px;background:#24282a;border:1px solid #44494b;border-radius:6px}h2{font-size:17px;margin:0 0 14px}.pair{display:flex;gap:24px}figure{margin:0;text-align:center}canvas{width:128px;height:128px;image-rendering:pixelated;background:#505151}figcaption{font-size:13px;margin-top:8px}p{font-size:13px;color:#babcb7;line-height:1.7}.note{width:700px}</style><h1>돌죽 0.24 원본 ↔ 잔향도시 · 원형 계단</h1><main><article><h2>돌죽 0.24</h2><div class="pair"><figure><canvas id="cu" width="32" height="32"></canvas><figcaption>올라가는 계단</figcaption></figure><figure><canvas id="cd" width="32" height="32"></canvas><figcaption>내려가는 계단</figcaption></figure></div><p>위로 솟은 계단과 바닥에 파인 계단의<br>윤곽·단면·깊이가 다름</p></article><article><h2>잔향도시 · 원형 계단</h2><div class="pair"><figure><canvas id="hu" width="32" height="32"></canvas><figcaption>올라가는 계단</figcaption></figure><figure><canvas id="hd" width="32" height="32"></canvas><figcaption>내려가는 계단</figcaption></figure></div><p>돌죽의 솟은 윤곽 / 파인 구멍 구분<br>솟은 나선형 단 / 안으로 파인 중심 구멍</p></article></main><p class="note">원본 픽셀을 동일한 바닥 위에 4배 확대 표시. 실제 시안은 32px 한 칸으로 표시됩니다.</p><script>const paths={cu:'assets/crawl-up32.png',cd:'assets/crawl-down32.png',hu:'assets/stairs-up08-32.png',hd:'assets/stairs-down06-32.png'};Promise.all(Object.entries(paths).map(([id,src])=>new Promise(resolve=>{const im=new Image;im.onload=()=>{const c=document.getElementById(id),x=c.getContext('2d');x.imageSmoothingEnabled=false;x.fillStyle='#505151';x.fillRect(0,0,32,32);const pad=0;x.drawImage(im,pad,pad,32-pad*2,32-pad*2);resolve();};im.src=src;}))).then(()=>window.ready=true);</script></html>
