<!doctype html><html lang="ko"><meta charset="utf-8"><title>초코센 1성 · 채운 하트와 높이 수정</title><style>body{background:#101923;color:#eff3ff;font:17px "Malgun Gothic";margin:24px;max-width:1150px}p{line-height:1.8}img{image-rendering:pixelated;max-width:100%}section{background:#202d40;border:1px solid #455875;border-radius:12px;padding:18px;margin:22px 0}a{color:#bbcdff}</style><h1>초코센 1성 · 달콤한 시선</h1><p>빈 테두리를 속이 찬 분홍 하트로 바꾸고, 기존보다 게임 픽셀 6칸 위로 올렸습니다. 우측 위치와 중첩별 크기 변화는 유지하며 대상 머리 윗부분에 하트 아래쪽만 살짝 걸칩니다. 최종 승인 전 수정안입니다.</p><section><h2>수정안 · 가까이 보기</h2><p>표식 없음 → 실제 공격으로 유혹 1~5중첩 → 바로 위 몬스터가 있는 경우. 원본 SDL 캡처를 최근접 확대했으며 이펙트를 덧그리지 않았습니다.</p><img src="tier1-close.gif"></section><section><h2>원래 필드 배율 비교</h2><img src="tier1.gif"></section><section><h2>이전 빈 하트 / 낮은 위치</h2><img src="../all-gods-vfx-draft04/clips/choco-corner.gif"></section><p><a href="../all-gods-vfx-draft04/index.html#choco">22신 통합 미리보기 · 초코로 돌아가기</a></p></html>
