<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>방 연결형 → 이어진 거리 비교</title><style>:root{color-scheme:dark}body{background:#151c20;color:#e6e9df;font:15px system-ui;max-width:1120px;margin:24px auto;padding:0 16px}h1{font-size:25px}p{color:#b7c2bb;line-height:1.8}header .controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:18px 0}button,input{font:inherit;color:#e1e9e1;background:#293833;border:1px solid #637b70;border-radius:4px;padding:9px 12px}input{width:160px}main{display:grid;grid-template-columns:1fr 1fr;gap:18px}article{padding:14px;background:#222e2d;border:1px solid #536e62;border-radius:7px;min-width:0}article:last-child{border-color:#a0c5a8}h2{font-size:18px;margin:3px 0 12px}canvas{display:block;width:100%;height:auto;image-rendering:pixelated}a{color:#b9dfce}.stats{font-size:13px;margin:12px 0;line-height:1.8}.legend{font-size:12px;color:#b5c2ba}footer{font-size:12px;line-height:1.8;color:#afbab2;margin:20px 0}@media(max-width:760px){main{grid-template-columns:1fr}h1{font-size:22px}}</style><header><h1>랜덤 모양은 살리고, 이동은 편하게</h1><p>이전2번과 같은 도트를 쓰되, 공간을 넓게 겹쳐 이어서 만들었습니다.<br>내부 벽 덩어리 사이로 돌아가는 길이 나며, 주요 동선에는 소품이 들어가지 않습니다.</p><div class="controls"><label for="seed">지도 번호</label><input id="seed" value="LAYOUT-001"><button id="apply">같은 번호로 비교</button><button id="reroll">다른 랜덤 예시</button></div><p class="legend">회색: 이동 공간 · 어두운색: 벽·건물 · 갈색: 진열·소품 · 초록/노랑: 위/아래 계단</p></header><main id="examples"></main><footer>80×70칸 · 브라우저 구조 시안 · 기존 도트20종·멤버84명 유지<br>오른쪽 지도는 ‘거리 보기’에서 넓은 주요길 표시를 켜고 걸어볼 수 있습니다.</footer><script src="legacy-generator.js"></script><script src="layout04-generator.js"></script><script src="generator.js"></script><script src="market-profiles.js"></script><script src="merch-catalog.js"></script><script src="market-generator.js"></script><script>
let serial=1;window.layoutExamples=[];
function make(){const seed=document.getElementById('seed').value.trim()||'LAYOUT-001',parent=document.getElementById('examples');parent.replaceChildren();window.layoutExamples=[];for(const kind of ['rooms','connected']){const map=MarketGen.generate(seed,4,'floor',kind),article=document.createElement('article'),title=document.createElement('h2'),canvas=document.createElement('canvas'),stats=document.createElement('div'),link=document.createElement('a');window.layoutExamples.push(map);title.textContent=kind==='rooms'?'이전2번 · 방과 통로':'새 예시 · 이어진 거리';canvas.width=480;canvas.height=420;const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.fillStyle='#172022';ctx.fillRect(0,0,480,420);for(let y=0;y<map.h;y++)for(let x=0;x<map.w;x++){const cell=map.cells[y*map.w+x];if(cell===0)continue;ctx.fillStyle=cell===2?'#b68e68':'#8e9b91';ctx.fillRect(x*6,y*6,6,6);}ctx.fillStyle='#c6a485';for(const p of map.marketWalls)ctx.fillRect(p.x*6,p.y*6,12,6);ctx.fillStyle='#8dd5b3';ctx.fillRect(map.upstairs.x*6-1,map.upstairs.y*6-1,8,8);ctx.fillStyle='#e9c46e';ctx.fillRect(map.exit.x*6-1,map.exit.y*6-1,8,8);stats.className='stats';stats.textContent=kind==='connected'?'겹친 공간 · 내부 벽 '+map.islands+'덩어리 · 주요길3칸 폭': '따로 뽑은 방과 연결 통로 · 1칸 길 '+map.flowMetrics.singleFileCells+'칸';link.href='index.html?layout='+kind+'&seed='+encodeURIComponent(seed)+'&view=focus';link.textContent='이 지도를 거리 도트로 보고 걸어보기 →';article.append(title,canvas,stats,link);parent.append(article);}window.layoutExamplesReady=true;}
document.getElementById('apply').onclick=make;document.getElementById('reroll').onclick=()=>{document.getElementById('seed').value='FLOW-'+String(++serial).padStart(3,'0')+'-'+Math.floor(Math.random()*100000);make();};make();
</script></html>
