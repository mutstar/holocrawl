<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>돌죽 0.34.1 원본 문</title><style>:root{color-scheme:dark;font:15px system-ui;color:#dfe8de;background:#161d20}*{box-sizing:border-box}main{max-width:700px;margin:28px auto;padding:0 16px}h1{font-size:23px}p{color:#b9c7bd;line-height:1.8}#originalDoors{display:grid;grid-template-columns:1fr 1fr;gap:16px}article{padding:16px;background:#222d2a;border:1px solid #526b60;border-radius:6px}h2{font-size:17px;margin:0 0 14px}canvas{display:block;width:256px;max-width:100%;height:auto;margin:auto;image-rendering:pixelated}a{color:#b4d9c2}.small{font-size:12px}@media(max-width:600px){#originalDoors{grid-template-columns:1fr}}</style></head><body><main><h1>돌죽 0.34.1 · 원본 기본 문</h1><p>원본 32×32 도트를 그대로 8배 확대했습니다.</p><section id="originalDoors"><article><h2>닫힘</h2><canvas id="closed" width="256" height="256"></canvas></article><article><h2>열림</h2><canvas id="open" width="256" height="256"></canvas></article></section><p class="small">기존 돌죽 문 PNG를 그대로 표시한 비교입니다. 배경은 현재 시멘트 바닥입니다.</p><p><a href="states.html">우리 철제 문의 닫힘·열림 비교 →</a></p></main><script>
const load=src=>new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=src;});
Promise.all([load('../city-layout07/assets/cement-reference.png'),load('assets/crawl-closed_door.png'),load('assets/crawl-open_door.png')]).then(([floor,closed,open])=>{for(const[id,im]of[['closed',closed],['open',open]]){const c=document.getElementById(id).getContext('2d');c.imageSmoothingEnabled=false;c.drawImage(floor,270,150,32,32,0,0,256,256);c.drawImage(im,0,0,256,256);}const note=document.createElement('p');note.className='small';note.textContent='버전 확인: 공식0.24.0과0.34.1의 기본 닫힘·열림 PNG를 직접 비교했으며, 두 상태 모두 파일 내용이 같습니다. 모든 테마 문·여러 칸 대문의 모양이 같다는 뜻은 아닙니다.';document.querySelector('footer')?.before(note)||document.querySelector('main').append(note);window.ready=true;});
</script></body></html>
