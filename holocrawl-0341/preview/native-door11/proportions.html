<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>문짝 비율 비교</title><style>:root{color-scheme:dark;font:15px system-ui;color:#dfe8de;background:#161d20}*{box-sizing:border-box}main{max-width:1050px;margin:25px auto;padding:0 16px}h1{font-size:23px}p{color:#b9c7bd;line-height:1.8}#proportions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}article{padding:14px;background:#222d2a;border:1px solid #526b60;border-radius:6px;min-width:0}h2{font-size:15px;margin:0 0 12px}canvas{display:block;width:256px;max-width:100%;height:auto;margin:auto;image-rendering:pixelated}small{display:block;margin-top:12px;color:#9eafa3;line-height:1.7}a{color:#b4d9c2}@media(max-width:850px){#proportions{grid-template-columns:1fr}}</style></head><body><main><h1>같은 32픽셀 칸 안에서 문짝이 차지하는 모양</h1><p>문 도트만 같은 배율로 확대했습니다. 벽·문설주는 제외한 비교입니다.</p><section id="proportions">
<article><h2>돌죽 · 기본 문</h2><canvas id="crawl" width="256" height="256"></canvas><small>둥근 아치 안의 문짝<br>중앙 이음선·세로 나뭇결</small></article>
<article><h2>우리 문 · 최초 32×32</h2><canvas id="ours" width="256" height="256"></canvas><small>네모 칸을 채우는 한 장 철판<br>밝고 굵은 가로 손잡이</small></article>
<article><h2>우리 가로문 · 현재 24×30</h2><canvas id="slim" width="256" height="256"></canvas><small>기존 그림의 표시 폭만 줄인 상태<br>문짝 자체의 구성은 동일</small></article>
</section><p><a href="states.html">현재 가로·세로 문의 닫힘·열림 보기 →</a></p></main><script>
const load=src=>new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=src;});
Promise.all([load('../city-layout07/assets/cement-reference.png'),load('assets/crawl-closed_door.png'),load('assets/fire-door-closed32.png')]).then(([floor,crawl,ours])=>{const source32Metrics={};for(const[id,im]of[['crawl',crawl],['ours',ours],['slim',ours]]){const c=document.getElementById(id).getContext('2d');c.imageSmoothingEnabled=false;c.drawImage(floor,270,150,32,32,0,0,256,256);if(id==='slim')c.drawImage(im,32,8,192,240);else c.drawImage(im,0,0,256,256);if(id!=='slim'){const raw=document.createElement('canvas');raw.width=raw.height=32;const rc=raw.getContext('2d');rc.drawImage(im,0,0);const d=rc.getImageData(0,0,32,32).data;let opaque=0;for(let i=3;i<d.length;i+=4)if(d[i]>200)opaque++;source32Metrics[id]={w:im.width,h:im.height,opaquePixels:opaque,totalPixels:1024};}}window.source32Metrics=source32Metrics;window.ready=true;});
</script></body></html>
