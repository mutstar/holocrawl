<title>방송 지하무대 · 리허설 스튜디오</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #161a20; color: #e3e8eb; font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 1192px; margin: auto; padding: 20px; }
  h1 { font-size: 25px; margin: 0 0 12px; }
  form { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
  input, button, select, a { font: inherit; color: inherit; background: #253039; border: 1px solid #4a5b66; border-radius: 4px; padding: 5px 9px; }
  a { text-decoration: none; }
  button { cursor: pointer; }
  button[aria-pressed=true] { background: #415b63; }
  input { width: 9rem; }
  #map { display: block; width: 100%; height: auto; background: #11151a; border: 1px solid #414d58; image-rendering: pixelated; }
  #status { color: #b7c6cb; margin: 7px 0; }
  @media (max-width: 600px) { main { padding: 12px; } h1 { font-size: 20px; } }
</style>
<main>
  <h1 id="title">방송 지하무대 1층 · 리허설 스튜디오</h1>
  <form>
    <label>층 <select id="floor"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
    <label>시드 <input id="seed" maxlength="64" value="rehearsal-01"></label>
    <button>이 시드 생성</button>
    <button type="button" id="random">새 랜덤 맵</button>
    <button type="button" id="overview" aria-pressed="false">전체 지도</button>
    <button type="button" id="wall-decor" aria-pressed="false" hidden>벽 장식 확대</button>
    <button type="button" id="work-area" aria-pressed="false" hidden>작업 구역 확대</button>
    <button type="button" id="door" aria-pressed="false" hidden>방음문 확대</button>
    <button type="button" id="studio" aria-pressed="true">리허설실 확대</button>
    <button type="button" id="booth" aria-pressed="false" hidden>유리 방송실</button>
    <button type="button" id="rehearsal" aria-pressed="false" hidden>카메라 리허설 세트</button>
    <button type="button" id="storage" aria-pressed="false" hidden>소품 보관실</button>
    <button type="button" id="lighting" aria-pressed="false" hidden>조명 제어실</button>
    <button type="button" id="cable" aria-pressed="false" hidden>케이블 덕트</button>
    <button type="button" id="loading" aria-pressed="false" hidden>승강기와 트러스 카트</button>
    <button type="button" id="fan" aria-pressed="false" hidden>환기팬</button>
    <button type="button" id="curtain-roll" aria-pressed="false" hidden>무대막 보관 롤</button>
    <button type="button" id="power-lever" aria-pressed="false" hidden>전원 차단 레버</button>
    <button type="button" id="service" aria-pressed="false" hidden>조명 정비 구역</button>
    <button type="button" id="freight" aria-pressed="false" hidden>화물 리프트와 지게차</button>
    <button type="button" id="warehouse" aria-pressed="false" hidden>세트 보관창고</button>
    <button type="button" id="goods-gate" aria-pressed="false" hidden>굿즈 창고 셔터</button>
    <a id="goods-entry" href="../forbidden-goods01/" hidden>금지된 굿즈 창고 1층으로</a>
    <button type="button" id="ending" aria-pressed="false" hidden>보상 고정지형</button>
    <button type="button" id="ward-doors" aria-pressed="false" hidden>병실 문 2배 확대</button>
    <label id="ending-examples" hidden>지형별 예시 <select id="ending-example"><option value="" disabled>지형 선택</option></select></label>
    <label id="routes-label" hidden><input id="routes" type="checkbox" style="width:auto"> 입구·보상 루트 표시</label>
    <button type="button" id="office-latch" hidden>사무실 안쪽 빗장 열기</button>
    <button type="button" data-ward="북쪽" hidden>북쪽 병실 문 열기</button>
    <button type="button" data-ward="남쪽" hidden>남쪽 병실 문 열기</button>
  </form>
  <canvas id="map" width="1152" height="576" role="img" aria-label="방송 지하무대 지도"></canvas>
  <p id="status" role="status">지도를 불러오는 중…</p>
</main>
