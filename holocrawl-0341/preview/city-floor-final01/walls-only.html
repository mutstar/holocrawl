<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>잔향도시 1층 · 벽과 바닥</title><style>body{margin:0;background:#101716;color:#dce6dd;font:15px system-ui}main{padding:16px;max-width:1500px;margin:auto}h1{font-size:21px}button{background:#263a2e;color:#dce6dd;border:1px solid #5a7163;padding:7px 12px;margin-bottom:12px;cursor:pointer}.scroll{overflow:auto;max-height:90vh}img{display:block;max-width:100%;height:auto;image-rendering:pixelated}img.raw{max-width:none}</style><main><h1>잔향도시 1층 · 벽과 바닥</h1><button onclick="document.querySelector('img').classList.toggle('raw')">원래 도트 크기 / 전체 보기</button><button id="compare">이전 모습과 비교</button><div class="scroll"><img id="map" src="walls-only12-floor.png?v=13" alt="소품 없이 벽과 바닥만 표시한 1층 전체"></div></main><script>let before=false;document.getElementById("compare").onclick=()=>{before=!before;document.getElementById("map").src=before?"walls-only13-before.png?v=13":"walls-only12-floor.png?v=13";document.getElementById("compare").textContent=before?"수정 모습 보기":"이전 모습과 비교";};</script></html>
