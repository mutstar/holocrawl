<h1>잔향도시 · 시설 외벽 연결 수정</h1>
<p>시설 9종의 외벽을 확정 콘크리트 벽 구조로 다시 그렸습니다. 옛 테두리를 제거하고 간판·부조는 벽 안에 배치했습니다.</p>
<nav aria-label="시설 비교"><button data-style="new103" aria-pressed="true">새 벽에 맞춘 시설 외벽</button><button data-style="previous102" aria-pressed="false">수정 전 외벽</button><button id="doors" aria-pressed="false">문 열기</button><span class="split"><label for="sample">시설 </label><select id="sample" aria-label="시설 선택"><option>불러오는 중…</option></select></span></nav>
<nav aria-label="지도 확대"><button data-mode="fit" aria-pressed="true">전체 지도</button><button data-mode="actual" aria-pressed="false">원본 크기</button><button data-mode="double" aria-pressed="false">2배 확대</button><button id="facility">시설 확대</button><button id="entrance">시설 입구 확대</button><button id="basicDoor">기본문 확대</button><a href="all-facilities.png" target="_blank">시설 9종 한눈에</a><a id="fullImage" href="#" target="_blank">전체 이미지</a></nav>
<canvas id="map" tabindex="0" aria-label="새 전용벽과 문을 적용한 시설 지도"></canvas>
<div id="status" role="status">시설을 불러오는 중…</div><p class="meta" id="meta"></p>
<footer>시설별 검토를 위해 시설 하나씩 지정 생성한 실제 지형 9개입니다. 한 층에 모든 시설을 넣은 지도는 아닙니다. 기본문101·내부 장식·통행 지형은 유지했습니다. 야외 운동장 울타리는 낮은 콘크리트 받침으로 연결했습니다. 엔진 아틀라스 적용 전 미리보기입니다.</footer>
