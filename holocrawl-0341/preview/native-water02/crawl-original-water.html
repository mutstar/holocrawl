<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>돌죽0.34.1 물 도트 원본</title><style>:root{color-scheme:dark;font:15px system-ui;background:#161d20;color:#dfe8df}main{max-width:700px;margin:25px auto;padding:0 16px}h1{font-size:23px}p{color:#b8c8bc;line-height:1.7}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}article{background:#222d2a;border:1px solid #526b60;padding:14px;border-radius:6px;min-width:0}h2{font-size:15px;margin:0 0 12px}canvas{display:block;width:256px;max-width:100%;height:auto;margin:auto;image-rendering:pixelated}a{color:#b4d9c2}@media(max-width:600px){.pair{grid-template-columns:1fr}}</style><main><h1>돌죽0.34.1 · 물 도트 원본</h1><p>왼쪽 얕은 물 / 오른쪽 깊은 물<br>원본32×32 PNG를 수정 없이4배 확대하여2×2칸으로 반복했습니다.</p><section class="pair" id="pair0"><article><h2>기본 물 · 얕은 물</h2><canvas width="256" height="256" data-name="shallow_water"></canvas></article><article><h2>기본 물 · 깊은 물</h2><canvas width="256" height="256" data-name="deep_water"></canvas></article></section><section class="pair" id="pair1"><article><h2>탁한 물 도트 · 얕은 물</h2><canvas width="256" height="256" data-name="shallow_water_murky"></canvas></article><article><h2>탁한 물 도트 · 깊은 물</h2><canvas width="256" height="256" data-name="deep_water_murky"></canvas></article></section><section class="pair" id="pair2"><article><h2>해안 Shoals · 얕은 물</h2><canvas width="256" height="256" data-name="shoals_shallow_water0"></canvas></article><article><h2>해안 Shoals · 깊은 물</h2><canvas width="256" height="256" data-name="shoals_deep_water0"></canvas></article></section><p><a href="index.html">우리 물 도트로 돌아가기 →</a></p></main><script>Promise.all(Array.from(document.querySelectorAll('canvas')).map(async c=>{const im=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src='assets/crawl-water/'+c.dataset.name+'.png';});const g=c.getContext('2d');g.imageSmoothingEnabled=false;for(let y=0;y<2;y++)for(let x=0;x<2;x++)g.drawImage(im,x*128,y*128,128,128);})).then(()=>window.ready=true);</script>
