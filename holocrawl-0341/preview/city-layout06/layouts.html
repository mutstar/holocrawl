<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1번·중간형·2번 구조 비교</title><style>:root{color-scheme:dark}body{background:#161d20;color:#e5eadd;font:15px system-ui;max-width:1180px;margin:25px auto;padding:0 16px}h1{font-size:25px}p{color:#bac5bc;line-height:1.8}.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:18px 0}button,input{font:inherit;color:#e0eadd;background:#293831;border:1px solid #678271;border-radius:4px;padding:9px 12px}input{width:160px}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}article{padding:12px;background:#222d2a;border:1px solid #526b60;border-radius:7px;min-width:0}article:nth-child(2){border-color:#b5d5a7;background:#29362f}h2{font-size:17px;margin:4px 0 12px}canvas{display:block;width:100%;height:auto;image-rendering:pixelated}a{color:#b4d9c2}.description{font-size:12px;min-height:63px}.stats{font-size:12px;color:#c0cfbc;margin:14px 0;line-height:1.8}footer{font-size:12px;color:#b4bfb4;margin:19px 0;line-height:1.8}@media(max-width:780px){main{grid-template-columns:1fr}.description{min-height:0}}</style><header><h1>방과 통로 — 중간형 — 넓게 이어진 공간</h1><p>중간형은 일부 공간을 넓은 구역으로 합치면서, 짧은 골목과 작은 옆 공간을 남겼습니다.<br>계단 사이 주요 길은3칸 폭으로 보호합니다.</p><div class="controls"><label for="seed">지도 번호</label><input id="seed" value="LAYOUT-001"><button id="apply">같은 번호로 비교</button><button id="reroll">다른 랜덤 예시</button></div></header><main id="examples"></main><footer>회색: 이동 공간 · 검정: 벽·건물 · 갈색: 진열·소품 · 초록/노랑: 위/아래 계단<br>80×70칸 · 브라우저 시안 · 같은 시드의1번·중간형·2번을 비교합니다.</footer><script src="legacy-generator.js"></script><script src="layout04-generator.js"></script><script src="layout05-generator.js"></script><script src="generator.js"></script><script src="market-profiles.js"></script><script src="merch-catalog.js"></script><script src="market-generator.js"></script><script>
let serial=1;window.layoutExamples=[];const descriptions={rooms:['1번 · 방과 통로','작은 공간이 따로 남고 통로로 이어집니다. 좁은 연결부가 상대적으로 많습니다.'],balanced:['중간형 · 구역과 짧은 골목','가까운 공간은 넓게 합치고, 그 사이에 짧은 골목과 작은 공간을 남깁니다.'],connected:['2번 · 넓게 이어진 공간','하나로 이어진 공간에 벽 덩어리를 놓아 넓게 돌아다니는 길을 만듭니다.']};
function make(){const seed=document.getElementById('seed').value.trim()||'LAYOUT-001',container=document.getElementById('examples');container.replaceChildren();window.layoutExamples=[];for(const kind of ['rooms','balanced','connected']){const map=MarketGen.generate(seed,4,'floor',kind),article=document.createElement('article'),title=document.createElement('h2'),canvas=document.createElement('canvas'),desc=document.createElement('p'),stats=document.createElement('div'),link=document.createElement('a');window.layoutExamples.push(map);title.textContent=descriptions[kind][0];canvas.width=400;canvas.height=350;const c=canvas.getContext('2d');c.fillStyle='#172022';c.fillRect(0,0,400,350);for(let y=0;y<map.h;y++)for(let x=0;x<map.w;x++){const cell=map.cells[y*map.w+x];if(cell===0)continue;c.fillStyle=cell===2?'#b48a65':'#8b998e';c.fillRect(x*5,y*5,5,5);}c.fillStyle='#c7a483';for(const p of map.marketWalls)c.fillRect(p.x*5,p.y*5,10,5);c.fillStyle='#8dd4b0';c.fillRect(map.upstairs.x*5-1,map.upstairs.y*5-1,7,7);c.fillStyle='#e8c46e';c.fillRect(map.exit.x*5-1,map.exit.y*5-1,7,7);desc.className='description';desc.textContent=descriptions[kind][1];stats.className='stats';stats.textContent='이동 '+map.validation.walkable+'칸 · 1칸 길 '+map.flowMetrics.singleFileCells+'칸'+(kind!=='rooms'?' · 주요길3칸 폭':'');link.href='index.html?layout='+kind+'&seed='+encodeURIComponent(seed)+'&view=focus';link.textContent='거리 도트로 보고 걸어보기 →';article.append(title,canvas,desc,stats,link);container.append(article);}window.layoutExamplesReady=true;}
document.getElementById('apply').onclick=make;document.getElementById('reroll').onclick=()=>{document.getElementById('seed').value='MIDDLE-'+String(++serial).padStart(3,'0')+'-'+Math.floor(Math.random()*100000);make();};make();
</script></html>
