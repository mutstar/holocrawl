<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>잔향도시 · 랜덤 구조3종</title><style>:root{color-scheme:dark}body{background:#161b1f;color:#e9e9df;font:15px system-ui;max-width:1160px;margin:26px auto;padding:0 16px}h1{font-size:25px}p{color:#b7c1bd;line-height:1.7}a{color:#a9d8ca}header .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0}button,input{font:inherit;padding:9px 12px;border:1px solid #64766e;background:#293531;color:#e0e8df;border-radius:4px}input{width:160px}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}article{padding:12px;border:1px solid #50615c;border-radius:7px;background:#222b2c;min-width:0}h2{font-size:17px;margin:4px 0 10px}canvas{width:100%;height:auto;image-rendering:pixelated;display:block;background:#131819}article p{font-size:12px;min-height:63px}article .stats{font-size:12px;color:#a9b8af;line-height:1.7;margin:10px 0}article a{display:inline-block;padding:8px 0}footer{font-size:12px;color:#afbab3;margin:18px 0;line-height:1.8}.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;margin:15px 0}.legend span::before{content:'';display:inline-block;width:10px;height:10px;background:var(--c);margin-right:5px}@media(max-width:780px){main{grid-template-columns:1fr}article p{min-height:0}h1{font-size:22px}}</style></head><body><header><h1>같은 도시 도트로, 크게 달라지는 지도</h1><p>사각 구획을 반복하던 방식과 비교하기 위한 브라우저 생성 예시입니다. 세 가지 큰 구조를 먼저 고르고, 방·길·계단·진열품 위치를 다시 생성합니다.</p><div class="controls"><label for="seed">지도 번호</label><input id="seed" value="LAYOUT-001"><button id="apply">같은 번호로 비교</button><button id="reroll">다른 랜덤 예시</button><a href="index.html?layout=previous&seed=LAYOUT-001&view=overview">이전 사각 구획 보기</a></div><div class="legend"><span style="--c:#89948d">이동 공간</span><span style="--c:#171e21">벽·건물</span><span style="--c:#b68d66">소품</span><span style="--c:#bfa37f">상점 전면</span><span style="--c:#82cbae">올라가는 계단</span><span style="--c:#e5c46f">내려가는 계단</span></div></header><main id="examples"></main><footer>80×70칸 · 모든 길과 계단 연결 검사 · 시드 고정 · 몹·보상 없음<br>돌죽처럼 여러 구조를 섞는 방향의 별도 브라우저 생성기입니다. 원본 돌죽 생성기를 그대로 실행한 결과는 아닙니다.</footer><script src="legacy-generator.js"></script><script src="generator.js"></script><script src="market-profiles.js"></script><script src="merch-catalog.js"></script><script src="market-generator.js"></script><script>
let serial=1;window.layoutExamples=[];
function make(){const seed=document.getElementById('seed').value.trim()||'LAYOUT-001',container=document.getElementById('examples');container.replaceChildren();window.layoutExamples=[];for(const kind of ['plaza','rooms','alleys']){const map=MarketGen.generate(seed,4,'floor',kind);window.layoutExamples.push(map);const article=document.createElement('article'),title=document.createElement('h2'),canvas=document.createElement('canvas'),desc=document.createElement('p'),stats=document.createElement('div'),link=document.createElement('a');title.textContent=map.layoutName;canvas.width=400;canvas.height=350;const c=canvas.getContext('2d');c.imageSmoothingEnabled=false;c.fillStyle='#171e21';c.fillRect(0,0,400,350);for(let y=0;y<map.h;y++)for(let x=0;x<map.w;x++){const cell=map.cells[y*map.w+x];if(cell===0)continue;c.fillStyle=cell===2?'#b68d66':'#89948d';c.fillRect(x*5,y*5,5,5);}c.fillStyle='#bfa37f';for(const p of map.marketWalls)c.fillRect(p.x*5,p.y*5,10,5);c.fillStyle='#82cbae';c.fillRect(map.upstairs.x*5-1,map.upstairs.y*5-1,7,7);c.fillStyle='#e5c46f';c.fillRect(map.exit.x*5-1,map.exit.y*5-1,7,7);desc.textContent=map.layoutDetail;stats.className='stats';stats.textContent='이동 '+map.validation.walkable+'칸 · 공간 '+map.rooms.length+'곳 · 길 연결 '+map.edges.length+'개';link.href='index.html?layout='+kind+'&seed='+encodeURIComponent(seed)+'&view=focus';link.textContent='이 구조를 실제 거리 도트로 보기 →';article.append(title,canvas,desc,stats,link);container.append(article);}window.layoutExamplesReady=true;}
document.getElementById('apply').onclick=make;document.getElementById('reroll').onclick=()=>{document.getElementById('seed').value='LAYOUT-'+String(++serial).padStart(3,'0')+'-'+Math.floor(Math.random()*100000);make();};make();
</script></body></html>
