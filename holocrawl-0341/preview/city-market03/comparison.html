<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>상점가 축소 방식 비교</title><style>body{background:#171b1e;color:#e4e6de;font:15px system-ui;max-width:1160px;margin:24px auto;padding:0 14px}a{color:#a8d4d0}h1{font-size:23px}p{color:#b6bcb6;line-height:1.6}main{display:grid;grid-template-columns:1fr 1fr;gap:14px}article{border:1px solid #4d5857;background:#242b2d;padding:12px;border-radius:7px;min-width:0}h2{font-size:15px;margin:0 0 12px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pair figure{margin:0;min-width:0}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;background:#484b47}figcaption{font-size:12px;margin-bottom:7px}small{color:#a5afaa}@media(max-width:700px){main{grid-template-columns:1fr}}</style><a href="index.html#acrylic">← 거리 화면에서 비교</a><h1>같은 도트 · 축소 방식 비교</h1><p>위쪽은 실제 크기, 아래쪽은 같은 도트를4배 확대한 모습입니다. 원화·소품 크기·진열 멤버는 동일하게 맞췄습니다.</p><main id="cases"></main><p id="status">비교 준비 중…</p><script src="members.js"></script><script src="merch-catalog.js"></script><script src="market-stock.js"></script><script src="pixel-reducer.js"></script><script src="clean-merch.js"></script><script>
const images={},load=src=>new Promise((r,j)=>{const i=new Image;i.onload=()=>r(i);i.onerror=j;i.src=src;});
Promise.all([...MerchCatalog.flatMap(m=>[[m.id,m.file],['clean-'+m.id,'assets/props-clean/'+m.id+'.png']]),...MarketMembers.map(m=>['member-'+m.id,m.image])].map(async([id,src])=>images[id]=await load(src))).then(()=>{
MarketStock.makeSprites(images);for(const id of ['acrylic-window','acrylic-rack','shirt-window','delivery-boxes','keychain-hooks','trash-bags']){const meta=MerchCatalog.find(m=>m.id===id),article=document.createElement('article'),title=document.createElement('h2'),pair=document.createElement('div');title.textContent=meta.name;pair.className='pair';for(const quality of ['original','clean']){MarketStock.setQuality(quality);const tile=document.createElement('canvas');tile.width=meta.width;tile.height=32;MarketStock.draw(tile.getContext('2d'),{x:0,y:0,type:id},{seed:'COMPARE',floorNumber:4},images,32,0);const figure=document.createElement('figure'),label=document.createElement('figcaption'),canvas=document.createElement('canvas');canvas.width=256;canvas.height=176;const c=canvas.getContext('2d');c.imageSmoothingEnabled=false;c.drawImage(tile,(256-meta.width)/2,4);c.drawImage(tile,(256-meta.width*4)/2,46,meta.width*4,128);label.textContent=quality==='original'?'이전 축소본':'축소 정리본';figure.append(label,canvas);pair.append(figure);}article.append(title,pair);document.getElementById('cases').append(article);}MarketStock.setQuality('clean');document.getElementById('status').textContent='바탕 그림은 유지하고, 축소·색 정리·아크릴 외곽선을 조정한 비교 시안입니다.';window.comparisonReady=true;
}).catch(e=>{document.getElementById('status').textContent=e.message;throw e;});
</script></html>
